<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Glow-Effekt -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Hintergrund-Verlauf wie dunkles Glas -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14263f"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <!-- Glasglanz oben (typisch Windows 7) -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fenster-Körper -->
  <rect x="3" y="5" width="58" height="54" rx="9" fill="url(#bg)" stroke="#7fff4f" stroke-width="2.5"/>

  <!-- Glasglanz -->
  <rect x="5" y="7" width="54" height="22" rx="7" fill="url(#shine)"/>

  <!-- Titelleiste mit drei Buttons (wie oben rechts auf deiner Seite) -->
  <line x1="5" y1="17" x2="59" y2="17" stroke="#7fff4f" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="49" cy="12" r="2" fill="#7fff4f" opacity="0.7"/>
  <circle cx="54" cy="12" r="2" fill="#7fff4f" opacity="0.7"/>
  <circle cx="59" cy="12" r="0" fill="none"/>

  <!-- Terminal-Symbol mit Glow -->
  <g filter="url(#glow)">
    <path d="M14 28 L27 38 L14 48" fill="none" stroke="#7fff4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="32" y="44" width="16" height="5" rx="2" fill="#7fff4f"/>
  </g>
</svg>
